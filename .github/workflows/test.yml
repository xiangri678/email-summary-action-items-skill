name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_messages.py examples/messages.example.json
      - run: python3 scripts/summarize_emails.py --input examples/messages.example.json --date 2026-09-07 --dry-run
      - run: python3 scripts/validate_summary.py --input examples/summary.example.md --messages examples/messages.example.json --report /tmp/validation.json
      - run: python3 -m py_compile scripts/*.py
